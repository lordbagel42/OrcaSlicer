# OrcaSlicer Web — full stack.
#
#   cd webui && docker compose up --build
#
# Then open http://localhost:8088
#
# NOTE: the backend image builds OrcaSlicer from source the first time, which
# is long. See README.md for the optional AppImage fast path.

services:
  backend:
    build:
      # repo root — the backend Dockerfile needs build_linux.sh, deps/,
      # src/ and resources/profiles.
      context: ..
      dockerfile: webui/backend/Dockerfile
    environment:
      PORT: "8080"
      ORCA_WORK_DIR: /tmp/orca
    volumes:
      - orca_jobs:/tmp/orca
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  orca_jobs:
