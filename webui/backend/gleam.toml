name = "orca_web"
version = "1.0.0"
target = "erlang"
description = "OrcaSlicer web backend — wraps the orca-slicer CLI and Moonraker"

[dependencies]
gleam_stdlib = ">= 0.40.0 and < 2.0.0"
gleam_erlang = ">= 0.30.0 and < 1.0.0"
gleam_http = ">= 3.7.0 and < 4.0.0"
gleam_json = ">= 2.0.0 and < 3.0.0"
gleam_httpc = ">= 4.0.0 and < 5.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
wisp = ">= 1.0.0 and < 2.0.0"
mist = ">= 4.0.0 and < 5.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
shellout = ">= 1.6.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
